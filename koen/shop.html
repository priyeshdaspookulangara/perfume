<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Collection — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pt-5">
  <div class="grain"></div>
  <div id="navbar-placeholder"></div>

  <header class="py-5 px-4 container-fluid mt-5">
    <div class="reveal">
      <div class="section-label mb-2">The Collection</div>
      <h1 class="display-3 font-display">Discover Your <em>Essence</em></h1>
    </div>
  </header>

  <section class="container-fluid px-4 py-5">
    <div class="row g-5">
      <!-- Sidebar -->
      <aside class="col-lg-3 col-md-4">
        <div id="filterSidebar" class="p-4 border sticky-top" style="border-color:var(--border)!important; top: 100px;">
          <h6 class="font-ui text-gold ls-wide small mb-4">Filter By</h6>

          <!-- Category -->
          <div class="mb-4">
            <p class="font-ui text-muted-cream small ls-wide mb-3">Category</p>
            <div class="form-check mb-2">
              <input class="form-check-input filter-cat" type="checkbox" value="homme" id="catHomme">
              <label class="form-check-label small font-ui text-cream" for="catHomme">Pour Homme</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input filter-cat" type="checkbox" value="femme" id="catFemme">
              <label class="form-check-label small font-ui text-cream" for="catFemme">Pour Femme</label>
            </div>
            <div class="form-check mb-2">
              <input class="form-check-input filter-cat" type="checkbox" value="gifts" id="catGifts">
              <label class="form-check-label small font-ui text-cream" for="catGifts">Gifts & Sets</label>
            </div>
          </div>

          <!-- Price Range -->
          <div class="mb-4">
            <p class="font-ui small ls-wide mb-3 text-muted-cream">Max Price: <span class="text-gold">₹<span id="priceMaxVal">3500</span></span></p>
            <input type="range" class="form-range" id="priceRange" min="0" max="3500" step="100" value="3500" style="accent-color: var(--gold)">
          </div>

          <!-- Size pills -->
          <div class="mb-4">
            <p class="font-ui small ls-wide mb-3 text-muted-cream">Size</p>
            <div class="d-flex gap-2 flex-wrap" id="sizeFilter">
              <button class="btn btn-outline-gold btn-sm size-pill active px-3" data-size="all">All</button>
              <button class="btn btn-outline-gold btn-sm size-pill px-3" data-size="5">5ml</button>
              <button class="btn btn-outline-gold btn-sm size-pill px-3" data-size="10">10ml</button>
              <button class="btn btn-outline-gold btn-sm size-pill px-3" data-size="30">30ml</button>
            </div>
          </div>

          <a href="#" id="clearFilters" class="text-gold small font-ui ls-wide d-block mt-4 text-decoration-none border-bottom border-gold w-max" style="width: fit-content;">Clear All</a>
        </div>
      </aside>

      <!-- Main Grid -->
      <main class="col-lg-9 col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-5 reveal">
          <small class="text-muted-cream font-ui ls-wide" id="productCount">Showing all items</small>
          <select class="form-select w-auto border-0 bg-transparent text-cream font-ui small ls-wide" id="sortSelect" style="box-shadow: none;">
            <option value="featured" class="bg-dark">Featured</option>
            <option value="price-asc" class="bg-dark">Price: Low to High</option>
            <option value="price-desc" class="bg-dark">Price: High to Low</option>
            <option value="newest" class="bg-dark">Newest</option>
          </select>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="productGrid">
          <!-- Products rendered here -->
        </div>

        <div class="text-center mt-5 py-5 reveal">
          <button class="btn btn-outline-gold px-5 py-3">Load More</button>
        </div>
      </main>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="cart-drawer-placeholder"></div>
  <div id="toast-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      $("#navbar-placeholder").load("partials/_navbar.html", function() {
        $(window).trigger('scroll');
      });
      $("#footer-placeholder").load("partials/_footer.html");
      $("#cart-drawer-placeholder").load("partials/_cart-drawer.html");
      $("#toast-placeholder").load("partials/_toast-container.html");

      // Handle URL params
      const params = new URLSearchParams(window.location.search);
      const catParam = params.get('cat');
      if (catParam) {
        $(`#cat${catParam.charAt(0).toUpperCase() + catParam.slice(1)}`).prop('checked', true);
      }

      function renderProductGrid(products) {
        let html = '';
        products.forEach((p, i) => {
          html += `
            <div class="col reveal" style="transition-delay: ${0.1 * (i % 6)}s">
              <div class="koen-card overflow-hidden">
                <a href="product.html?id=${p.id}" class="d-block position-relative overflow-hidden">
                  <img src="${p.image}" class="w-100" style="aspect-ratio: 3/4; object-fit: cover">
                  ${p.badge ? `<span class="badge bg-gold text-dark position-absolute top-0 end-0 m-3 ls-wide">${p.badge}</span>` : ''}
                </a>
                <div class="p-4">
                  <small class="text-gold font-ui ls-wider mb-2 d-block">${p.scentFamily}</small>
                  <h5 class="font-display mb-3">${p.name}</h5>
                  <div class="d-flex justify-content-between align-items-center mt-4">
                    <span class="fs-5 text-cream font-display">₹${p.price}</span>
                    <button class="btn btn-outline-gold btn-sm py-2 px-3 add-to-cart-btn" data-id="${p.id}"><i class="bi bi-bag"></i></button>
                  </div>
                </div>
              </div>
            </div>
          `;
        });
        if (products.length === 0) {
          html = '<div class="col-12 text-center py-5"><p class="font-display fs-4 italic">No products found matching your criteria.</p></div>';
        }
        $('#productGrid').html(html);
        $('#productCount').text(`Showing ${products.length} of ${KOEN_PRODUCTS.length} items`);
        initReveal();
      }

      function filterProducts() {
        let products = [...KOEN_PRODUCTS];
        const cats = $('.filter-cat:checked').map((i, e) => e.value).get();
        if (cats.length) products = products.filter(p => cats.includes(p.category));

        const maxPrice = parseInt($('#priceRange').val());
        $('#priceMaxVal').text(maxPrice);
        products = products.filter(p => p.price <= maxPrice);

        const activeSize = $('.size-pill.active').data('size');
        if (activeSize !== 'all') {
          products = products.filter(p => p.sizes.some(s => s.ml == activeSize));
        }

        const sort = $('#sortSelect').val();
        if (sort === 'price-asc') products.sort((a, b) => a.price - b.price);
        if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
        if (sort === 'newest') products.sort((a, b) => b.id - a.id);

        renderProductGrid(products);
      }

      $('.filter-cat, #priceRange, #sortSelect').on('change', filterProducts);
      $('.size-pill').on('click', function() {
        $('.size-pill').removeClass('active');
        $(this).addClass('active');
        filterProducts();
      });

      $('#clearFilters').on('click', function(e) {
        e.preventDefault();
        $('.filter-cat').prop('checked', false);
        $('#priceRange').val(3500);
        $('.size-pill').removeClass('active');
        $('[data-size="all"]').addClass('active');
        filterProducts();
      });

      // Add to cart click
      $(document).on('click', '.add-to-cart-btn', function(e) {
        e.preventDefault();
        const id = $(this).data('id');
        const p = KOEN_PRODUCTS.find(x => x.id == id);
        addToCart({
          id: p.id + '-' + p.sizes[1].ml,
          name: p.name,
          size: p.sizes[1].ml + 'ml',
          price: p.sizes[1].price,
          image: p.image
        });
      });

      // Initial filter
      filterProducts();
    });
  </script>
</body>
</html>
