<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Detail — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-ink text-cream">
  <div class="grain"></div>
  <div id="navbar-placeholder"></div>

  <section class="py-5 mt-5 container">
    <div class="row g-4">
      <!-- Sidebar -->
      <div class="col-lg-3">
        <div id="account-sidebar-placeholder"></div>
      </div>

      <!-- Main Content -->
      <div class="col-lg-9">
        <div class="koen-card p-5 reveal">
          <div class="d-flex justify-content-between align-items-start mb-5 pb-4 border-bottom border-muted">
            <div>
              <a href="account-orders.html" class="text-gold small font-ui ls-wide text-decoration-none mb-3 d-inline-block">← BACK TO ORDERS</a>
              <h2 class="font-display mb-1" id="orderIdLabel">Order #KN12345678</h2>
              <p class="text-muted small mb-0" id="orderDateLabel">Placed on April 06, 2026</p>
            </div>
            <div class="text-end">
              <span id="orderStatusBadge" class="order-status status-placed">PLACED</span>
              <div class="mt-3">
                <a href="track.html" id="trackLink" class="btn btn-outline-gold btn-sm py-2 px-4">Track Shipment</a>
              </div>
            </div>
          </div>

          <!-- Items -->
          <h6 class="font-ui text-gold ls-wider mb-4">Items Summary</h6>
          <div id="orderDetailsBody" class="mb-5">
            <!-- Rendered by jQuery -->
          </div>

          <div class="row g-5">
            <div class="col-md-6">
              <h6 class="font-ui text-gold ls-wider mb-3">Shipping Address</h6>
              <div id="shippingAddress" class="small text-muted-cream lh-lg">
                <!-- Rendered by jQuery -->
              </div>
            </div>
            <div class="col-md-6">
              <h6 class="font-ui text-gold ls-wider mb-3">Order Summary</h6>
              <div class="d-flex justify-content-between mb-2 small"><span class="text-muted">Subtotal</span><span id="subtotalVal">₹0</span></div>
              <div class="d-flex justify-content-between mb-2 small"><span class="text-muted">Shipping</span><span id="shippingVal">₹79</span></div>
              <div class="d-flex justify-content-between mb-4 border-top border-muted pt-3">
                <span class="font-display fs-5">Total</span>
                <span class="font-display fs-4 text-gold" id="totalVal">₹0</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="cart-drawer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAuth()) return;
      $("#navbar-placeholder").load("partials/_navbar.html", () => $(window).trigger('scroll'));
      $("#footer-placeholder").load("partials/_footer.html");
      $("#cart-drawer-placeholder").load("partials/_cart-drawer.html");

      // Load account sidebar
      const user = getUser();
      const initials = user.name.split(' ').map(n => n[0]).join('');
      const sidebarHtml = `
        <div class="koen-card p-4 sticky-top" style="top: 100px;">
          <div class="d-flex align-items-center gap-3 mb-4 pb-4 border-bottom border-muted">
            <div class="avatar-circle">${initials}</div>
            <div>
              <div class="font-display fs-5">${user.name}</div>
              <small class="text-muted-cream">${user.email}</small>
            </div>
          </div>
          <nav class="d-flex flex-column gap-1">
            <a href="account.html" class="account-nav-link"><i class="bi bi-grid"></i> Dashboard</a>
            <a href="account-orders.html" class="account-nav-link active"><i class="bi bi-box"></i> My Orders</a>
            <a href="account-wishlist.html" class="account-nav-link"><i class="bi bi-heart"></i> Wishlist</a>
            <a href="account-profile.html" class="account-nav-link"><i class="bi bi-person"></i> Profile</a>
            <a href="#" id="logoutBtn" class="account-nav-link text-muted-cream mt-3"><i class="bi bi-box-arrow-right"></i> Logout</a>
          </nav>
        </div>`;
      $('#account-sidebar-placeholder').html(sidebarHtml);

      // Fetch order detail
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('id');
      const orders = JSON.parse(localStorage.getItem('koen_orders') || '[]');
      const order = orders.find(o => o.id === orderId);

      if (order) {
        $('#orderIdLabel').text(`Order #${order.id}`);
        $('#orderDateLabel').text(`Placed on ${new Date(order.date).toLocaleDateString(undefined, {month:'long', day:'numeric', year:'numeric'})}`);
        $('#orderStatusBadge').text(order.status.toUpperCase()).attr('class', 'order-status status-' + order.status.toLowerCase());
        $('#trackLink').attr('href', 'track.html?id=' + order.id);

        let itemsHtml = '';
        order.items.forEach(item => {
          itemsHtml += `
            <div class="d-flex align-items-center gap-4 py-3 border-bottom border-muted">
              <img src="${item.image}" style="width: 60px; height: 80px; object-fit: cover">
              <div class="flex-grow-1">
                <h6 class="font-display mb-0">${item.name}</h6>
                <small class="text-muted font-ui ls-wide small">${item.size}</small>
              </div>
              <div class="text-end">
                <div class="small text-muted mb-1">₹${item.price} × ${item.qty}</div>
                <div class="text-gold font-display fs-5">₹${item.price * item.qty}</div>
              </div>
            </div>`;
        });
        $('#orderDetailsBody').html(itemsHtml);

        const subtotal = order.items.reduce((s, i) => s + (i.price * i.qty), 0);
        $('#subtotalVal').text(`₹${subtotal.toLocaleString()}`);
        $('#totalVal').text(`₹${order.total.toLocaleString()}`);

        const addr = order.address;
        $('#shippingAddress').html(`${addr.name}<br>${addr.phone}<br>${addr.address1}${addr.address2 ? ', ' + addr.address2 : ''}<br>${addr.city}, ${addr.state} - ${addr.pincode}`);
      } else {
        $('.koen-card').html('<div class="text-center py-5"><h3 class="font-display">Order Not Found</h3><a href="account-orders.html" class="btn btn-gold mt-4">Back to My Orders</a></div>');
      }
    });
  </script>
</body>
</html>
