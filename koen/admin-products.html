<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Products — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-black">
  <div class="grain"></div>

  <!-- Sidebar -->
  <div id="admin-sidebar-placeholder"></div>

  <!-- Main Content -->
  <main style="margin-left:240px;padding:40px;min-height:100vh">
    <div class="d-flex justify-content-between align-items-end mb-5">
      <div>
        <div class="section-label mb-2">Inventory Management</div>
        <h1 class="display-5 font-display">Manage <em>Products</em></h1>
      </div>
      <a href="admin-product-edit.html" class="btn btn-gold px-4 py-3">+ ADD PRODUCT</a>
    </div>

    <!-- Filters -->
    <div class="admin-card mb-4 py-3">
      <div class="row g-3 align-items-center">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-0 text-gold pe-0 ps-3"><i class="bi bi-search"></i></span>
            <input type="text" id="productSearch" class="form-control bg-transparent border-0 text-cream px-3 font-ui small ls-wide shadow-none" placeholder="SEARCH PRODUCTS...">
          </div>
        </div>
        <div class="col-md-3">
          <select class="form-select bg-transparent border-0 text-cream font-ui small ls-wide shadow-none" id="catFilter">
            <option value="all" class="bg-dark">ALL CATEGORIES</option>
            <option value="homme" class="bg-dark">POUR HOMME</option>
            <option value="femme" class="bg-dark">POUR FEMME</option>
            <option value="gifts" class="bg-dark">GIFTS</option>
          </select>
        </div>
        <div class="col-md-3 ms-auto text-end">
          <small class="text-muted-cream font-ui small ls-wide" id="pCount">20 products total</small>
        </div>
      </div>
    </div>

    <div class="admin-card">
      <div class="table-responsive">
        <table class="table table-borderless admin-table align-middle">
          <thead>
            <tr>
              <th>IMAGE</th>
              <th>NAME</th>
              <th>CATEGORY</th>
              <th>PRICE</th>
              <th>STATUS</th>
              <th class="text-end">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="adminProductsBody">
            <!-- Rendered by jQuery -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAdmin()) return;
      $("#admin-sidebar-placeholder").load("partials/_admin-sidebar.html", function() {
        $('.admin-nav-link').removeClass('active');
        $('#nav-products').addClass('active');
      });
      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      function renderProducts(list) {
        let html = '';
        list.forEach(p => {
          html += `
            <tr>
              <td><img src="${p.image}" style="width:40px;height:55px;object-fit:cover;border:1px solid var(--border)"></td>
              <td class="font-display fs-5">${p.name}</td>
              <td class="font-ui small ls-wide text-muted-cream">${p.category.toUpperCase()}</td>
              <td class="text-gold font-ui">₹${p.price}</td>
              <td>
                <div class="form-check form-switch">
                  <input class="form-check-input" type="checkbox" checked style="background-color: var(--gold); border-color: var(--gold)">
                  <label class="form-check-label font-ui small text-muted-cream ls-wide">ACTIVE</label>
                </div>
              </td>
              <td class="text-end">
                <div class="d-flex gap-2 justify-content-end">
                  <a href="admin-product-edit.html?id=${p.id}" class="btn btn-outline-gold btn-sm px-3 py-2" style="font-size: 8px;"><i class="bi bi-pencil"></i></a>
                  <button class="btn btn-outline-gold btn-sm px-3 py-2 delete-p" data-id="${p.id}" style="font-size: 8px; border-color: #c85050; color: #c85050"><i class="bi bi-trash"></i></button>
                </div>
              </td>
            </tr>
          `;
        });
        $('#adminProductsBody').html(html);
        $('#pCount').text(`${list.length} products found`);
      }

      renderProducts(KOEN_PRODUCTS);

      // Search & Filter
      $('#productSearch, #catFilter').on('input change', function() {
        const query = $('#productSearch').val().toLowerCase();
        const cat = $('#catFilter').val();
        let filtered = KOEN_PRODUCTS.filter(p => p.name.toLowerCase().includes(query));
        if (cat !== 'all') filtered = filtered.filter(p => p.category === cat);
        renderProducts(filtered);
      });

      // Delete mock
      $(document).on('click', '.delete-p', function() {
        const id = $(this).data('id');
        if (confirm('Are you sure you want to delete this product?')) {
          showToast(`Product ${id} deleted (Mock)`);
          $(this).closest('tr').fadeOut();
        }
      });
    });
  </script>
</body>
</html>
