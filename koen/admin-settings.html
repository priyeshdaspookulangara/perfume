<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: Settings — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-ink text-cream">
  <div class="grain"></div>
  <div id="admin-sidebar-placeholder"></div>

  <main style="margin-left: 220px; padding: 32px 40px;">
    <h1 class="font-display h2 mb-5">Store <em>Settings</em></h1>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="koen-card p-4 mb-4">
          <h5 class="font-display mb-4">General Settings</h5>
          <form id="generalSettings">
            <div class="row g-4">
              <div class="col-12">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="storeName" placeholder=" " value="KOEN E-Commerce">
                  <label>Store Name</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-floating-gold">
                  <input type="email" class="koen-input" id="supportEmail" placeholder=" " value="concierge@koen.in">
                  <label>Support Email Address</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="supportPhone" placeholder=" " value="+91 98765 43210">
                  <label>Support Phone Number</label>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-gold btn-sm px-4">Save Changes</button>
              </div>
            </div>
          </form>
        </div>

        <div class="koen-card p-4 mb-4">
          <h5 class="font-display mb-4">Logistics Settings</h5>
          <form id="logisticsSettings">
            <div class="row g-4">
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="number" class="koen-input" id="shippingFee" placeholder=" " value="79">
                  <label>Standard Shipping Fee (₹)</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="number" class="koen-input" id="freeShippingThreshold" placeholder=" " value="1500">
                  <label>Free Shipping Threshold (₹)</label>
                </div>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-gold btn-sm px-4">Save Logistics</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="koen-card p-4 mb-4">
          <h5 class="font-display mb-4">Theme Configuration</h5>
          <div class="mb-4">
            <label class="font-ui text-muted ls-wide small mb-2 d-block">PRIMARY BRAND COLOR</label>
            <div class="d-flex align-items-center gap-3">
              <div style="width: 40px; height: 40px; background: #c4a46b; border: 1px solid var(--border)"></div>
              <span class="font-display">#c4a46b (Gold)</span>
            </div>
          </div>
          <div class="mb-4">
            <label class="font-ui text-muted ls-wide small mb-2 d-block">FILM GRAIN OPACITY</label>
            <input type="range" class="form-range" min="0" max="100" value="22" style="accent-color: var(--gold)">
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="maintenanceMode">
            <label class="form-check-label font-ui small ls-wide" for="maintenanceMode">MAINTENANCE MODE</label>
          </div>
        </div>

        <div class="koen-card p-4">
          <h5 class="font-display text-danger mb-4">Danger Zone</h5>
          <p class="small text-muted mb-4">Be careful, these actions are irreversible.</p>
          <button class="btn btn-outline-danger w-100 btn-sm mb-3">Reset Store Database</button>
          <button class="btn btn-outline-danger w-100 btn-sm">Clear Cache</button>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <style>
    .btn-outline-danger { border-radius: 0; font-family: 'Tenor Sans'; font-size: 10px; letter-spacing: 0.15em; border-color: #c85050; color: #c85050; }
    .btn-outline-danger:hover { background: #c85050; color: #fff; }
  </style>
  <script>
    $(document).ready(function() {
      if (!requireAdmin()) return;
      $("#admin-sidebar-placeholder").load("partials/_admin-sidebar.html");

      $('form').on('submit', function(e) {
        e.preventDefault();
        showToast('Settings saved successfully');
      });
    });
  </script>
</body>
</html>
