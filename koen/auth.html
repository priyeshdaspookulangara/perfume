<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-4">
  <div class="grain"></div>

  <div class="koen-card p-5 reveal" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-5">
      <a href="index.html" class="font-display text-gold fs-1 text-decoration-none">Koen</a>
      <p class="font-ui text-muted-cream small ls-wider mt-2">PRIVATE ACCESS</p>
    </div>

    <ul class="nav nav-tabs border-0 mb-5 d-flex justify-content-center gap-4 font-ui small ls-wide" id="authTabs">
      <li class="nav-item">
        <button class="nav-link active bg-transparent border-0 text-muted-cream px-0 pb-2 rounded-0 shadow-none" data-bs-toggle="tab" data-bs-target="#tab-login" type="button" style="border-bottom: 2px solid transparent !important;">LOGIN</button>
      </li>
      <li class="nav-item">
        <button class="nav-link bg-transparent border-0 text-muted-cream px-0 pb-2 rounded-0 shadow-none" data-bs-toggle="tab" data-bs-target="#tab-register" type="button" style="border-bottom: 2px solid transparent !important;">REGISTER</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- Login -->
      <div class="tab-pane fade show active" id="tab-login">
        <form id="loginForm">
          <div class="form-floating-gold mb-4">
            <input type="email" class="koen-input" id="loginEmail" placeholder=" ">
            <label>Email Address</label>
            <div class="invalid-feedback font-ui small text-danger mt-1" style="font-size: 10px;">Invalid email or password</div>
          </div>
          <div class="form-floating-gold mb-5">
            <input type="password" class="koen-input" id="loginPass" placeholder=" ">
            <label>Password</label>
            <div class="text-end mt-2">
              <a href="#" class="small font-ui text-muted-cream text-decoration-none" style="font-size: 10px;">FORGOT PASSWORD?</a>
            </div>
          </div>
          <button type="submit" class="btn btn-gold w-100 py-3 mb-4">Sign In</button>
        </form>
      </div>

      <!-- Register -->
      <div class="tab-pane fade" id="tab-register">
        <form id="registerForm">
          <div class="form-floating-gold mb-4">
            <input type="text" class="koen-input" id="regName" placeholder=" ">
            <label>Full Name</label>
          </div>
          <div class="form-floating-gold mb-4">
            <input type="email" class="koen-input" id="regEmail" placeholder=" ">
            <label>Email Address</label>
          </div>
          <div class="form-floating-gold mb-5">
            <input type="password" class="koen-input" id="regPass" placeholder=" ">
            <label>Password</label>
          </div>
          <button type="submit" class="btn btn-gold w-100 py-3 mb-4">Create Account</button>
        </form>
      </div>
    </div>

    <div class="text-center">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="flex-grow-1" style="height: 1px; background: var(--border)"></div>
        <small class="font-ui text-muted-cream ls-wide" style="font-size: 9px;">OR CONTINUE WITH</small>
        <div class="flex-grow-1" style="height: 1px; background: var(--border)"></div>
      </div>
      <button class="btn btn-outline-gold w-100 py-3 d-flex align-items-center justify-content-center gap-3">
        <i class="bi bi-google"></i>
        <span>GOOGLE ACCOUNT</span>
      </button>
    </div>
  </div>

  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      // Tab styling
      $('#authTabs button').on('shown.bs.tab', function() {
        $('#authTabs button').css('border-bottom-color', 'transparent').removeClass('text-gold');
        $(this).css('border-bottom-color', 'var(--gold)').addClass('text-gold');
      });
      $('#authTabs button.active').trigger('shown.bs.tab');

      // Login handler
      $('#loginForm').on('submit', function(e) {
        e.preventDefault();
        const email = $('#loginEmail').val();
        const pass = $('#loginPass').val();

        const user = KOEN_USERS.find(u => u.email === email && u.password === pass);
        if (user) {
          localStorage.setItem('koen_user', JSON.stringify(user));
          showToast(`Welcome back, ${user.name}`);
          setTimeout(() => {
            window.location.href = user.isAdmin ? 'admin-dashboard.html' : 'account.html';
          }, 1000);
        } else {
          $('#loginEmail, #loginPass').addClass('shake').css('border-bottom-color', 'red');
          $('.invalid-feedback').show();
          setTimeout(() => {
            $('#loginEmail, #loginPass').removeClass('shake');
          }, 600);
        }
      });

      // Register handler
      $('#registerForm').on('submit', function(e) {
        e.preventDefault();
        const newUser = {
          id: Date.now(),
          name: $('#regName').val(),
          email: $('#regEmail').val(),
          password: $('#regPass').val(),
          isAdmin: false
        };
        localStorage.setItem('koen_user', JSON.stringify(newUser));
        showToast('Account created successfully');
        setTimeout(() => window.location.href = 'account.html', 1500);
      });

      initReveal();
    });
  </script>
</body>
</html>
