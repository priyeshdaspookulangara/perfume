<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-vh-100 d-flex align-items-center justify-content-center p-4">
  <div class="grain"></div>

  <div class="koen-card p-5 reveal" style="max-width: 480px; width: 100%;">
    <div class="text-center mb-5">
      <a href="index.html" class="font-display text-gold fs-1 text-decoration-none">Koen</a>
      <p class="font-ui text-muted-cream small ls-wider mt-2">ADMINISTRATOR ACCESS</p>
    </div>

    <form id="adminLoginForm">
      <div class="form-floating-gold mb-4">
        <input type="email" class="koen-input" id="loginEmail" placeholder=" ">
        <label>Admin Email</label>
      </div>
      <div class="form-floating-gold mb-5">
        <input type="password" class="koen-input" id="loginPass" placeholder=" ">
        <label>Admin Password</label>
      </div>
      <button type="submit" class="btn btn-gold w-100 py-3 mb-4">Authorize</button>
      <div class="text-center">
        <a href="auth.html" class="small font-ui text-muted-cream text-decoration-none" style="font-size: 10px;">SWITCH TO CUSTOMER LOGIN</a>
      </div>
    </form>
  </div>

  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      $('#adminLoginForm').on('submit', function(e) {
        e.preventDefault();
        const email = $('#loginEmail').val();
        const pass = $('#loginPass').val();

        const user = KOEN_USERS.find(u => u.email === email && u.password === pass && u.isAdmin);
        if (user) {
          localStorage.setItem('koen_user', JSON.stringify(user));
          showToast(`Authorized: Welcome back, ${user.name}`);
          setTimeout(() => {
            window.location.href = 'admin-dashboard.html';
          }, 1000);
        } else {
          $('#loginEmail, #loginPass').addClass('shake').css('border-bottom-color', 'red');
          showToast('Authorization failed', 'error');
          setTimeout(() => {
            $('#loginEmail, #loginPass').removeClass('shake');
          }, 600);
        }
      });
      initReveal();
    });
  </script>
</body>
</html>
