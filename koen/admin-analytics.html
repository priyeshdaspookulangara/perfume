<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin: Analytics — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-ink text-cream">
  <div class="grain"></div>
  <div id="admin-sidebar-placeholder"></div>

  <main style="margin-left: 220px; padding: 32px 40px;">
    <div class="d-flex justify-content-between align-items-center mb-5">
      <h1 class="font-display h2 mb-0">Store <em>Analytics</em></h1>
      <div class="d-flex gap-3">
        <input type="date" class="form-control form-control-sm bg-dark text-cream border-muted w-auto" id="dateFrom">
        <input type="date" class="form-control form-control-sm bg-dark text-cream border-muted w-auto" id="dateTo">
        <button class="btn btn-gold btn-sm px-4">Generate Report</button>
      </div>
    </div>

    <!-- Summary Stats -->
    <div class="row g-4 mb-5">
      <div class="col-md-3">
        <div class="koen-card p-4 text-center">
          <small class="font-ui text-gold ls-wide d-block mb-2">AVG ORDER VALUE</small>
          <div class="font-display h3 mb-0">₹1,124</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="koen-card p-4 text-center">
          <small class="font-ui text-gold ls-wide d-block mb-2">CONV. RATE</small>
          <div class="font-display h3 mb-0">4.2%</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="koen-card p-4 text-center">
          <small class="font-ui text-gold ls-wide d-block mb-2">RETENTION</small>
          <div class="font-display h3 mb-0">28%</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="koen-card p-4 text-center">
          <small class="font-ui text-gold ls-wide d-block mb-2">TOP CHANNEL</small>
          <div class="font-display h3 mb-0">Direct</div>
        </div>
      </div>
    </div>

    <div class="row g-4">
      <div class="col-lg-8">
        <div class="koen-card p-4">
          <h5 class="font-display mb-4">Revenue <em>Growth</em></h5>
          <canvas id="revenueLineChart" height="300"></canvas>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="koen-card p-4">
          <h5 class="font-display mb-4">Sales by <em>Category</em></h5>
          <canvas id="categoryDonutChart" height="300"></canvas>
        </div>
      </div>
      <div class="col-lg-12">
        <div class="koen-card p-4">
          <h5 class="font-display mb-4">Top Selling <em>Products</em></h5>
          <canvas id="topProductsBarChart" height="150"></canvas>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAdmin()) return;
      $("#admin-sidebar-placeholder").load("partials/_admin-sidebar.html");

      // Line Chart
      new Chart(document.getElementById('revenueLineChart'), {
        type: 'line',
        data: {
          labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
          datasets: [{
            data: [12000, 19000, 15000, 25000],
            borderColor: '#c4a46b',
            backgroundColor: 'rgba(196,164,107,0.1)',
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#8a7d6e' }, grid: { color: 'rgba(196,164,107,0.08)' } },
            y: { ticks: { color: '#8a7d6e' }, grid: { color: 'rgba(196,164,107,0.08)' } }
          }
        }
      });

      // Donut Chart
      new Chart(document.getElementById('categoryDonutChart'), {
        type: 'doughnut',
        data: {
          labels: ['Homme', 'Femme', 'Gifts'],
          datasets: [{
            data: [45, 35, 20],
            backgroundColor: ['#c4a46b', '#8a7d6e', '#7a4f2e'],
            borderWidth: 0
          }]
        },
        options: {
          plugins: { legend: { position: 'bottom', labels: { color: '#f4efe6' } } }
        }
      });

      // Bar Chart
      new Chart(document.getElementById('topProductsBarChart'), {
        type: 'bar',
        data: {
          labels: ['Intense Man', 'Velvet Rose', 'Saffron Dusk', 'Midnight Oud', 'Oud Wood'],
          datasets: [{
            data: [120, 95, 88, 72, 65],
            backgroundColor: '#c4a46b'
          }]
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#8a7d6e' }, grid: { display: false } },
            y: { ticks: { color: '#f4efe6' }, grid: { display: false } }
          }
        }
      });
    });
  </script>
</body>
</html>
