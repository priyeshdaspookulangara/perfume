<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pt-5">
  <div class="grain"></div>
  <div id="navbar-placeholder"></div>

  <section class="container-fluid px-4 py-5 mt-5">
    <div class="row g-5">
      <!-- Sidebar -->
      <aside class="col-lg-3 reveal" id="account-sidebar-placeholder"></aside>

      <!-- Content -->
      <main class="col-lg-9 reveal delay-1">
        <div class="mb-5">
          <div class="section-label mb-2">Member Details</div>
          <h1 class="display-4 font-display">Personal <em>Profile</em></h1>
        </div>

        <div class="koen-card p-5">
          <form id="profileForm">
            <div class="row g-4">
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="profileName" placeholder=" ">
                  <label>Full Name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="email" class="koen-input" id="profileEmail" placeholder=" " readonly>
                  <label>Email Address</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="tel" class="koen-input" id="profilePhone" placeholder=" ">
                  <label>Phone Number</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="profileDob" placeholder="YYYY-MM-DD">
                  <label>Date of Birth</label>
                </div>
              </div>

              <div class="col-12 mt-5">
                <h5 class="font-display mb-4 fs-3">Security</h5>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="password" class="koen-input" id="currPass" placeholder=" ">
                  <label>Current Password</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="password" class="koen-input" id="newPass" placeholder=" ">
                  <label>New Password</label>
                </div>
              </div>
            </div>

            <div class="d-flex gap-3 mt-5">
              <button type="submit" class="btn btn-gold px-5 py-3">Save Changes</button>
            </div>
          </form>
        </div>
      </main>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="cart-drawer-placeholder"></div>
  <div id="toast-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAuth()) return;

      $("#navbar-placeholder").load("partials/_navbar.html", function() {
        $(window).trigger('scroll');
      });
      $("#footer-placeholder").load("partials/_footer.html");
      $("#cart-drawer-placeholder").load("partials/_cart-drawer.html");
      $("#toast-placeholder").load("partials/_toast-container.html");

      const user = getUser();
      $("#account-sidebar-placeholder").load("partials/_account-sidebar.html", function() {
        $('#userName').text(user.name);
        $('#userEmail').text(user.email);
        $('#userInitials').text(user.name.split(' ').map(n => n[0]).join('').toUpperCase());
        $('.account-nav-link').removeClass('active');
        $('#acc-nav-profile').addClass('active');
      });
      $('#profileName').text(user.name);
      $('#profileName').val(user.name);
      $('#profileEmail').text(user.email);
      $('#profileEmail').val(user.email);
      $('#profilePhone').val('9876543210'); // Mock

      // Logout
      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      // Save Changes
      $('#profileForm').on('submit', function(e) {
        e.preventDefault();
        const updatedUser = { ...user, name: $('#profileName').val() };
        localStorage.setItem('koen_user', JSON.stringify(updatedUser));
        showToast('Profile updated successfully');
        $('#userName').text(updatedUser.name);
        $('#userInitials').text(updatedUser.name.split(' ').map(n => n[0]).join('').toUpperCase());
      });

      initReveal();
    });
  </script>
</body>
</html>
