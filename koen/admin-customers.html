<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Customers — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-black">
  <div class="grain"></div>

  <!-- Sidebar -->
  <div id="admin-sidebar-placeholder"></div>

  <!-- Main Content -->
  <main style="margin-left:240px;padding:40px;min-height:100vh">
    <div class="d-flex justify-content-between align-items-end mb-5">
      <div>
        <div class="section-label mb-2">Member Directory</div>
        <h1 class="display-5 font-display">Manage <em>Customers</em></h1>
      </div>
      <button class="btn btn-gold px-4 py-3">EXPORT DIRECTORY</button>
    </div>

    <div class="admin-card">
      <div class="table-responsive">
        <table class="table table-borderless admin-table align-middle">
          <thead>
            <tr>
              <th>AVATAR</th>
              <th>NAME</th>
              <th>EMAIL</th>
              <th>TOTAL SPENT</th>
              <th>ORDERS</th>
              <th class="text-end">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="adminCustomersBody">
            <!-- Rendered by jQuery -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAdmin()) return;
      $("#admin-sidebar-placeholder").load("partials/_admin-sidebar.html", function() {
        $('.admin-nav-link').removeClass('active');
        $('#nav-customers').addClass('active');
      });
      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      function renderCustomers() {
        let html = '';
        KOEN_USERS.forEach(u => {
          const initials = u.name.split(' ').map(n => n[0]).join('').toUpperCase();
          html += `
            <tr>
              <td><div class="avatar-circle" style="width:32px;height:32px;font-size:10px">${initials}</div></td>
              <td class="font-display fs-5">${u.name} ${u.isAdmin?'<span class="badge bg-gold text-dark ms-2 py-1 px-2" style="font-size:8px">ADMIN</span>':''}</td>
              <td class="font-ui small text-muted-cream">${u.email}</td>
              <td class="text-gold font-ui">₹14,500</td>
              <td class="font-ui small text-cream">12</td>
              <td class="text-end">
                <button class="btn btn-outline-gold btn-sm px-3 py-2" style="font-size: 8px;">VIEW PROFILE</button>
              </td>
            </tr>
          `;
        });
        $('#adminCustomersBody').html(html);
      }
      renderCustomers();
    });
  </script>
</body>
</html>
