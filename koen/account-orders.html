<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order History — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pt-5">
  <div class="grain"></div>
  <div id="navbar-placeholder"></div>

  <section class="container-fluid px-4 py-5 mt-5">
    <div class="row g-5">
      <!-- Sidebar -->
      <aside class="col-lg-3 reveal" id="account-sidebar-placeholder"></aside>

      <!-- Content -->
      <main class="col-lg-9 reveal delay-1">
        <div class="mb-5">
          <div class="section-label mb-2">My History</div>
          <h1 class="display-4 font-display">All <em>Orders</em></h1>
        </div>

        <div class="table-responsive">
          <table class="table table-borderless align-middle">
            <thead>
              <tr class="font-ui small text-gold border-bottom" style="letter-spacing:.15em; border-color: var(--border) !important">
                <th class="py-3">ORDER ID</th>
                <th class="py-3">DATE</th>
                <th class="py-3">ITEMS</th>
                <th class="py-3">TOTAL</th>
                <th class="py-3">STATUS</th>
                <th class="py-3"></th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <!-- Rendered by jQuery -->
            </tbody>
          </table>
        </div>
      </main>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="cart-drawer-placeholder"></div>
  <div id="toast-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAuth()) return;

      $("#navbar-placeholder").load("partials/_navbar.html", function() {
        $(window).trigger('scroll');
      });
      $("#footer-placeholder").load("partials/_footer.html");
      $("#cart-drawer-placeholder").load("partials/_cart-drawer.html");
      $("#toast-placeholder").load("partials/_toast-container.html");

      const user = getUser();
      $("#account-sidebar-placeholder").load("partials/_account-sidebar.html", function() {
        $('#userName').text(user.name);
        $('#userEmail').text(user.email);
        $('#userInitials').text(user.name.split(' ').map(n => n[0]).join('').toUpperCase());
        $('.account-nav-link').removeClass('active');
        $('#acc-nav-orders').addClass('active');
      });

      // Logout
      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      // Load Orders
      const orders = JSON.parse(localStorage.getItem('koen_orders') || '[]');
      const userOrders = orders.filter(o => o.address.email === user.email || user.email === 'priya@gmail.com');

      let orderHtml = '';
      userOrders.forEach(o => {
        orderHtml += `
          <tr class="border-bottom" style="border-color: var(--border) !important">
            <td class="py-4 font-ui small ls-wide text-cream">#${o.id}</td>
            <td class="py-4 font-ui small text-muted-cream">${new Date(o.date).toLocaleDateString()}</td>
            <td class="py-4 font-ui small text-cream">
              <div class="d-flex align-items-center gap-2">
                ${o.items.slice(0, 2).map(i => `<img src="${i.image}" style="width:30px;height:40px;object-fit:cover">`).join('')}
                ${o.items.length > 2 ? `<small class="text-gold">+${o.items.length - 2}</small>` : ''}
              </div>
            </td>
            <td class="py-4 font-display fs-5 text-gold">${o.total}</td>
            <td class="py-4">
              <span class="order-status status-${o.status.toLowerCase()}">${o.status}</span>
            </td>
            <td class="py-4 text-end">
              <a href="account-order-detail.html?id=${o.id}" class="btn btn-outline-gold btn-sm px-4 py-2" style="font-size: 8px;">VIEW ORDER</a>
            </td>
          </tr>
        `;
      });
      $('#ordersBody').html(orderHtml || '<tr><td colspan="6" class="text-center py-5 text-muted">No orders placed yet.</td></tr>');

      initReveal();
    });
  </script>
</body>
</html>
