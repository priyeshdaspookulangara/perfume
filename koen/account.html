<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Dashboard — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pt-5">
  <div class="grain"></div>
  <div id="navbar-placeholder"></div>

  <section class="container-fluid px-4 py-5 mt-5">
    <div class="row g-5">
      <!-- Sidebar -->
      <aside class="col-lg-3 reveal" id="account-sidebar-placeholder"></aside>

      <!-- Content -->
      <main class="col-lg-9 reveal delay-1">
        <div class="mb-5">
          <div class="section-label mb-2">Member Dashboard</div>
          <h1 class="display-4 font-display">Welcome back, <em id="userFirstName">Priya</em></h1>
        </div>

        <!-- Stats -->
        <div class="row g-0 mb-5 border" style="border-color: var(--border) !important">
          <div class="col-md-4 p-4 border-end" style="border-color: var(--border) !important">
            <small class="font-ui text-gold small ls-wider d-block mb-2">TOTAL ORDERS</small>
            <h2 class="font-display h1 mb-0" id="totalOrders">0</h2>
          </div>
          <div class="col-md-4 p-4 border-end" style="border-color: var(--border) !important">
            <small class="font-ui text-gold small ls-wider d-block mb-2">TOTAL SPENT</small>
            <h2 class="font-display h1 mb-0" id="totalSpent">₹0</h2>
          </div>
          <div class="col-md-4 p-4">
            <small class="font-ui text-gold small ls-wider d-block mb-2">WISH-LISTED</small>
            <h2 class="font-display h1 mb-0" id="wishlistCount">0</h2>
          </div>
        </div>

        <!-- Recent Orders -->
        <div class="mb-5">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h4 class="font-display fs-3">Recent Orders</h4>
            <a href="account-orders.html" class="text-gold small font-ui ls-wide text-decoration-none">View All</a>
          </div>
          <div class="table-responsive">
            <table class="table table-borderless align-middle">
              <thead>
                <tr class="font-ui small text-gold border-bottom" style="letter-spacing:.15em; border-color: var(--border) !important">
                  <th class="py-3">ORDER ID</th>
                  <th class="py-3">DATE</th>
                  <th class="py-3 text-center">ITEMS</th>
                  <th class="py-3">TOTAL</th>
                  <th class="py-3">STATUS</th>
                  <th class="py-3"></th>
                </tr>
              </thead>
              <tbody id="recentOrdersBody">
                <!-- Rendered by jQuery -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Wishlist Preview -->
        <div>
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h4 class="font-display fs-3">Saved To Wishlist</h4>
            <a href="account-wishlist.html" class="text-gold small font-ui ls-wide text-decoration-none">Manage List</a>
          </div>
          <div class="row row-cols-2 row-cols-md-3 g-4" id="wishlistPreview">
            <!-- Rendered by jQuery -->
          </div>
        </div>
      </main>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="cart-drawer-placeholder"></div>
  <div id="toast-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAuth()) return;

      $("#navbar-placeholder").load("partials/_navbar.html", function() {
        $(window).trigger('scroll');
      });
      $("#footer-placeholder").load("partials/_footer.html");
      $("#cart-drawer-placeholder").load("partials/_cart-drawer.html");
      $("#toast-placeholder").load("partials/_toast-container.html");

      const user = getUser();
      $("#account-sidebar-placeholder").load("partials/_account-sidebar.html", function() {
        $('#userName').text(user.name);
        $('#userEmail').text(user.email);
        $('#userInitials').text(user.name.split(' ').map(n => n[0]).join('').toUpperCase());
        $('.account-nav-link').removeClass('active');
        $('#acc-nav-dashboard').addClass('active');
      });
      $('#userFirstName').text(user.name.split(' ')[0]);

      // Logout
      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      // Load Orders
      const orders = JSON.parse(localStorage.getItem('koen_orders') || '[]');
      const userOrders = orders.filter(o => o.address.email === user.email || user.email === 'priya@gmail.com'); // Mock link
      $('#totalOrders').text(userOrders.length);

      let totalSpent = 0;
      let orderHtml = '';
      userOrders.slice(0, 3).forEach(o => {
        const val = parseInt(o.total.replace(/[₹,]/g, ''));
        totalSpent += val;
        orderHtml += `
          <tr class="border-bottom" style="border-color: var(--border) !important">
            <td class="py-4 font-ui small ls-wide text-cream">#${o.id}</td>
            <td class="py-4 font-ui small text-muted-cream">${new Date(o.date).toLocaleDateString()}</td>
            <td class="py-4 text-center font-ui small text-cream">${o.items.length}</td>
            <td class="py-4 font-display fs-5 text-gold">${o.total}</td>
            <td class="py-4">
              <span class="order-status status-${o.status.toLowerCase()}">${o.status}</span>
            </td>
            <td class="py-4 text-end">
              <a href="account-order-detail.html?id=${o.id}" class="btn btn-outline-gold btn-sm px-3 py-2" style="font-size: 8px;">DETAILS</a>
            </td>
          </tr>
        `;
      });
      $('#totalSpent').text('₹' + totalSpent.toLocaleString());
      $('#recentOrdersBody').html(orderHtml || '<tr><td colspan="6" class="text-center py-5 text-muted">No orders placed yet.</td></tr>');

      // Wishlist
      const wishlist = getWishlist();
      $('#wishlistCount').text(wishlist.length);

      let wishHtml = '';
      wishlist.slice(0, 3).forEach(id => {
        const p = KOEN_PRODUCTS.find(x => x.id == id);
        if (p) {
          wishHtml += `
            <div class="col">
              <div class="koen-card overflow-hidden">
                <a href="product.html?id=${p.id}" class="d-block">
                  <img src="${p.image}" class="w-100" style="aspect-ratio: 3/4; object-fit: cover">
                </a>
                <div class="p-3">
                  <h6 class="font-display mb-2 text-truncate">${p.name}</h6>
                  <div class="text-gold font-ui small ls-wide">₹${p.price}</div>
                </div>
              </div>
            </div>
          `;
        }
      });
      $('#wishlistPreview').html(wishHtml || '<div class="col-12"><p class="text-muted">Your wishlist is empty.</p></div>');

      initReveal();
    });
  </script>
</body>
</html>
