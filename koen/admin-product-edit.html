<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="bg-black">
  <div class="grain"></div>

  <!-- Sidebar -->
  <div id="admin-sidebar-placeholder"></div>

  <!-- Main Content -->
  <main style="margin-left:240px;padding:40px;min-height:100vh">
    <div class="d-flex justify-content-between align-items-end mb-5">
      <div>
        <div class="section-label mb-2">Product Catalog</div>
        <h1 class="display-5 font-display" id="pageTitle">Add <em>Product</em></h1>
      </div>
      <div class="d-flex gap-2">
        <a href="admin-products.html" class="btn btn-outline-gold px-4 py-3">CANCEL</a>
        <button class="btn btn-gold px-4 py-3" id="saveProduct">SAVE CHANGES</button>
      </div>
    </div>

    <form id="productEditForm">
      <div class="row g-4">
        <!-- Left Column -->
        <div class="col-lg-8">
          <div class="admin-card mb-4">
            <h5 class="font-display fs-4 mb-4 border-bottom border-secondary pb-3">Basic Information</h5>
            <div class="row g-3">
              <div class="col-12">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="pName" placeholder=" ">
                  <label>Product Name</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <select class="koen-input bg-dark" id="pCat">
                    <option value="homme">Pour Homme</option>
                    <option value="femme">Pour Femme</option>
                    <option value="gifts">Gifts & Sets</option>
                  </select>
                  <label>Category</label>
                </div>
              </div>
              <div class="col-md-6">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="pFamily" placeholder=" ">
                  <label>Scent Family</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-floating-gold">
                  <textarea class="koen-input" id="pDescription" style="height: 100px;" placeholder=" "></textarea>
                  <label>Description</label>
                </div>
              </div>
              <div class="col-12">
                <div class="form-floating-gold">
                  <textarea class="koen-input" id="pStory" style="height: 100px;" placeholder=" "></textarea>
                  <label>Scent Story</label>
                </div>
              </div>
            </div>
          </div>

          <div class="admin-card">
            <h5 class="font-display fs-4 mb-4 border-bottom border-secondary pb-3">Scent Notes</h5>
            <div class="row g-3">
              <div class="col-md-4">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="pTop" placeholder="Comma separated">
                  <label>Top Notes</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="pHeart" placeholder="Comma separated">
                  <label>Heart Notes</label>
                </div>
              </div>
              <div class="col-md-4">
                <div class="form-floating-gold">
                  <input type="text" class="koen-input" id="pBase" placeholder="Comma separated">
                  <label>Base Notes</label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right Column -->
        <div class="col-lg-4">
          <div class="admin-card mb-4">
            <h5 class="font-display fs-4 mb-4 border-bottom border-secondary pb-3">Pricing & Inventory</h5>
            <div class="form-floating-gold">
              <input type="number" class="koen-input" id="pPrice" placeholder=" ">
              <label>Price (₹)</label>
            </div>
            <div class="form-floating-gold">
              <input type="number" class="koen-input" id="pCompare" placeholder=" ">
              <label>Compare Price (₹)</label>
            </div>
            <hr class="border-secondary">
            <div class="form-check form-switch mb-3 mt-4">
              <input class="form-check-input" type="checkbox" id="pFeatured" style="background-color: var(--gold); border-color: var(--gold)">
              <label class="form-check-label font-ui small text-cream ls-wide">FEATURE ON HOME</label>
            </div>
          </div>

          <div class="admin-card">
            <h5 class="font-display fs-4 mb-4 border-bottom border-secondary pb-3">Images</h5>
            <div class="mb-4">
              <img id="pImgPreview" src="https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?w=300&q=80" class="w-100 mb-3 border" style="aspect-ratio: 1/1; object-fit: cover; border-color: var(--border) !important">
              <div class="form-floating-gold">
                <input type="text" class="koen-input" id="pImgUrl" placeholder="https://...">
                <label>Main Image URL</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </form>
  </main>

  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAdmin()) return;
      $("#admin-sidebar-placeholder").load("partials/_admin-sidebar.html", function() {
        $('.admin-nav-link').removeClass('active');
        $('#nav-products').addClass('active');
      });
      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      const params = new URLSearchParams(window.location.search);
      const pid = params.get('id');

      if (pid) {
        const p = KOEN_PRODUCTS.find(x => x.id == pid);
        if (p) {
          $('#pageTitle').html(`Edit <em>${p.name}</em>`);
          $('#pName').val(p.name);
          $('#pCat').val(p.category);
          $('#pFamily').val(p.scentFamily);
          $('#pDescription').val(p.description);
          $('#pStory').val(p.scentStory);
          $('#pTop').val(p.topNotes.join(', '));
          $('#pHeart').val(p.heartNotes.join(', '));
          $('#pBase').val(p.baseNotes.join(', '));
          $('#pPrice').val(p.price);
          $('#pCompare').val(p.comparePrice);
          $('#pImgUrl').val(p.image);
          $('#pImgPreview').attr('src', p.image);
          if (p.badge === 'Bestseller') $('#pFeatured').prop('checked', true);
        }
      }

      $('#pImgUrl').on('input', function() {
        $('#pImgPreview').attr('src', $(this).val());
      });

      $('#saveProduct').on('click', function() {
        const updatedProduct = {
          id: pid ? parseInt(pid) : KOEN_PRODUCTS.length + 1,
          name: $('#pName').val(),
          category: $('#pCat').val(),
          scentFamily: $('#pFamily').val(),
          description: $('#pDescription').val(),
          scentStory: $('#pStory').val(),
          topNotes: $('#pTop').val().split(',').map(n => n.trim()),
          heartNotes: $('#pHeart').val().split(',').map(n => n.trim()),
          baseNotes: $('#pBase').val().split(',').map(n => n.trim()),
          price: parseInt($('#pPrice').val()),
          comparePrice: parseInt($('#pCompare').val()),
          image: $('#pImgUrl').val(),
          badge: $('#pFeatured').is(':checked') ? 'Bestseller' : '',
          sizes: [
            { ml: 5, price: Math.round($('#pPrice').val() * 0.6) },
            { ml: 10, price: parseInt($('#pPrice').val()) },
            { ml: 30, price: Math.round($('#pPrice').val() * 2.5) }
          ]
        };

        if (pid) {
          const idx = KOEN_PRODUCTS.findIndex(x => x.id == pid);
          if (idx > -1) KOEN_PRODUCTS[idx] = updatedProduct;
        } else {
          KOEN_PRODUCTS.push(updatedProduct);
        }

        // Persist to localStorage
        localStorage.setItem('koen_products_override', JSON.stringify(KOEN_PRODUCTS));

        showToast('Product saved successfully');
        setTimeout(() => {
          window.location.href = 'admin-products.html';
        }, 1200);
      });
    });
  </script>
</body>
</html>
