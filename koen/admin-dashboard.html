<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body class="bg-black">
  <div class="grain"></div>

  <!-- Sidebar -->
  <div id="admin-sidebar-placeholder"></div>

  <!-- Main Content -->
  <main style="margin-left:240px;padding:40px;min-height:100vh">
    <div class="d-flex justify-content-between align-items-end mb-5">
      <div>
        <div class="section-label mb-2">Performance Overview</div>
        <h1 class="display-5 font-display">Store <em>Analytics</em></h1>
      </div>
      <div class="text-end">
        <div class="font-ui small text-muted-cream mb-1">DATA UPDATED</div>
        <div class="font-ui small text-gold ls-wide">JUST NOW</div>
      </div>
    </div>

    <!-- KPI Cards -->
    <div class="row g-4 mb-5">
      <div class="col-md-3">
        <div class="admin-card kpi-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="font-ui text-gold small ls-wider">TOTAL REVENUE</small>
            <span class="kpi-badge up">+12.4% ↑</span>
          </div>
          <h2 class="font-display">₹1,84,200</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-card kpi-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="font-ui text-gold small ls-wider">TOTAL ORDERS</small>
            <span class="kpi-badge up">+8.2% ↑</span>
          </div>
          <h2 class="font-display">342</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-card kpi-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="font-ui text-gold small ls-wider">CUSTOMERS</small>
            <span class="kpi-badge down">−3.2% ↓</span>
          </div>
          <h2 class="font-display">1,284</h2>
        </div>
      </div>
      <div class="col-md-3">
        <div class="admin-card kpi-card">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <small class="font-ui text-gold small ls-wider">CONV. RATE</small>
            <span class="kpi-badge up">+1.5% ↑</span>
          </div>
          <h2 class="font-display">4.2%</h2>
        </div>
      </div>
    </div>

    <div class="row g-4 mb-5">
      <!-- Revenue Chart -->
      <div class="col-lg-8">
        <div class="admin-card">
          <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
            <h5 class="font-display fs-4 mb-0">Revenue Trend (30 Days)</h5>
            <div class="dropdown">
              <button class="btn btn-sm btn-outline-gold px-3" style="font-size: 8px;">EXPORT CSV</button>
            </div>
          </div>
          <canvas id="revenueChart" height="120"></canvas>
        </div>
      </div>
      <!-- Orders by Status -->
      <div class="col-lg-4">
        <div class="admin-card h-100">
          <h5 class="font-display fs-4 mb-4 pb-3 border-bottom border-secondary">Orders By Status</h5>
          <canvas id="statusChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Recent Orders Table -->
    <div class="admin-card">
      <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <h5 class="font-display fs-4 mb-0">Recent Transactions</h5>
        <a href="admin-orders.html" class="text-gold small font-ui ls-wide text-decoration-none">View All</a>
      </div>
      <div class="table-responsive">
        <table class="table table-borderless admin-table align-middle">
          <thead>
            <tr>
              <th>ORDER ID</th>
              <th>CUSTOMER</th>
              <th>DATE</th>
              <th>AMOUNT</th>
              <th>STATUS</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="adminRecentOrdersBody">
            <!-- Rendered by jQuery -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="toast-container" style="position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:flex-end"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      if (!requireAdmin()) return;
      $("#admin-sidebar-placeholder").load("partials/_admin-sidebar.html", function() {
        $('.admin-nav-link').removeClass('active');
        $('#nav-dashboard').addClass('active');
      });

      $('#logoutBtn').on('click', (e) => { e.preventDefault(); logout(); });

      // Revenue Chart
      const days = Array.from({length: 30}, (_, i) => i + 1);
      const revenueData = Array.from({length: 30}, () => Math.floor(Math.random() * 10000) + 5000);
      new Chart(document.getElementById('revenueChart'), {
        type: 'line',
        data: {
          labels: days,
          datasets: [{
            data: revenueData,
            borderColor: '#c4a46b',
            backgroundColor: 'rgba(196,164,107,0.08)',
            tension: 0.4,
            fill: true,
            pointBackgroundColor: '#c4a46b',
            borderWidth: 2
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#8a7d6e', font: { size: 10 } }, grid: { color: 'rgba(196,164,107,0.05)' } },
            y: { ticks: { color: '#8a7d6e', font: { size: 10 } }, grid: { color: 'rgba(196,164,107,0.05)' } }
          },
          responsive: true
        }
      });

      // Status Chart
      new Chart(document.getElementById('statusChart'), {
        type: 'doughnut',
        data: {
          labels: ['Placed', 'Shipped', 'Delivered', 'Cancelled'],
          datasets: [{
            data: [45, 80, 210, 15],
            backgroundColor: ['#8a7d6e', '#8ab4c8', '#c4a46b', '#c85050'],
            borderColor: '#0d0b07',
            borderWidth: 2
          }]
        },
        options: {
          plugins: {
            legend: { position: 'bottom', labels: { color: '#f4efe6', font: { family: 'Tenor Sans', size: 10 } } }
          }
        }
      });

      // Render Orders
      const orders = JSON.parse(localStorage.getItem('koen_orders') || '[]');
      let html = '';
      orders.slice(0, 5).forEach(o => {
        html += `
          <tr>
            <td>#${o.id}</td>
            <td>${o.address.name}</td>
            <td>${new Date(o.date).toLocaleDateString()}</td>
            <td>${o.total}</td>
            <td><span class="order-status status-${o.status.toLowerCase()}">${o.status}</span></td>
            <td class="text-end">
              <a href="admin-order-detail.html?id=${o.id}" class="btn btn-outline-gold btn-sm px-3 py-2" style="font-size: 8px;">VIEW</a>
            </td>
          </tr>
        `;
      });
      $('#adminRecentOrdersBody').html(html);
    });
  </script>
</body>
</html>
