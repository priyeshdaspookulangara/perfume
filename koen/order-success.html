<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .checkmark { width: 80px; height: 80px; border-radius: 50%; display: block; stroke-width: 2; stroke: var(--gold); stroke-miterlimit: 10; margin: 0 auto 30px; box-shadow: inset 0px 0px 0px var(--gold); animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s both; }
    .checkmark__circle { stroke-dasharray: 166; stroke-dashoffset: 166; stroke-width: 2; stroke-miterlimit: 10; stroke: var(--gold); fill: none; animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards; }
    .checkmark__check { transform-origin: 50% 50%; stroke-dasharray: 48; stroke-dashoffset: 48; animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards; }
    @keyframes stroke { 100% { stroke-dashoffset: 0; } }
    @keyframes scale { 0%, 100% { transform: none; } 50% { transform: scale3d(1.1, 1.1, 1); } }
    @keyframes fill { 100% { box-shadow: inset 0px 0px 0px 40px rgba(196,164,107,0.05); } }
  </style>
</head>
<body class="min-vh-100 d-flex flex-column justify-content-center align-items-center p-4">
  <div class="grain"></div>

  <div class="text-center reveal">
    <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
      <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
      <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
    </svg>

    <div class="section-label justify-content-center mb-3">Order Successful</div>
    <h1 class="display-3 font-display mb-4">Your <em>Essence</em> is on the way</h1>

    <p class="text-muted-cream font-ui ls-wide mb-5">Your order <span class="badge border border-gold text-gold" id="orderId">#KN123456</span> has been placed successfully.</p>

    <div class="koen-card p-4 mx-auto mb-5 text-start" style="max-width: 480px;">
      <h6 class="font-ui text-gold small ls-wider mb-4 pb-3 border-bottom" style="border-color: var(--border) !important">ORDER DETAILS</h6>
      <div id="orderItems" class="mb-4 overflow-auto" style="max-height: 200px;">
        <!-- Items here -->
      </div>
      <div class="d-flex justify-content-between align-items-center pt-3 border-top" style="border-color: var(--border) !important">
        <span class="font-display fs-4">Total Paid</span>
        <span class="font-display fs-3 text-gold" id="orderTotal">₹0</span>
      </div>
      <div class="mt-4 small text-muted-cream text-center font-ui ls-wide">
        Estimated delivery: <span class="text-cream" id="deliveryDate">March 25, 2024</span>
      </div>
    </div>

    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="shop.html" class="btn btn-outline-gold px-5 py-3">Continue Shopping</a>
      <a href="account-orders.html" class="btn btn-gold px-5 py-3">Track Order</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      const order = JSON.parse(localStorage.getItem('koen_last_order') || '{}');
      if (order.id) {
        $('#orderId').text('#' + order.id);
        $('#orderTotal').text(order.total);

        const est = new Date(order.date);
        est.setDate(est.getDate() + 5);
        $('#deliveryDate').text(est.toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' }));

        let html = '';
        order.items.forEach(item => {
          html += `
            <div class="d-flex justify-content-between gap-3 mb-3">
              <div class="d-flex gap-2">
                <img src="${item.image}" style="width:40px;height:50px;object-fit:cover">
                <div>
                  <div class="small font-display lh-1 mb-1">${item.name}</div>
                  <div class="text-muted-cream font-ui" style="font-size: 8px;">${item.size} × ${item.qty}</div>
                </div>
              </div>
              <div class="small font-ui text-cream">₹${(item.price * item.qty).toLocaleString()}</div>
            </div>
          `;
        });
        $('#orderItems').html(html);
      }
      initReveal();
    });
  </script>
</body>
</html>
