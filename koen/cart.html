<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Bag — KOEN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Tenor+Sans&family=DM+Sans:wght@200;300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="pt-5">
  <div class="grain"></div>
  <div id="navbar-placeholder"></div>

  <section class="container-fluid px-4 py-5 mt-5">
    <div class="reveal mb-5">
      <div class="section-label mb-2">Cart</div>
      <h1 class="display-4 font-display">Review Your <em>Selection</em></h1>
    </div>

    <div class="row g-5">
      <!-- Items -->
      <div class="col-lg-7 reveal delay-1" id="cartItems">
        <!-- Rendered by jQuery -->
      </div>

      <!-- Summary -->
      <div class="col-lg-4 offset-lg-1 reveal delay-2">
        <div class="koen-card p-4 sticky-top" style="top:100px">
          <h5 class="font-display mb-4 fs-4">Order Summary</h5>

          <div class="d-flex justify-content-between mb-3">
            <span class="small font-ui ls-wide text-muted-cream">Subtotal</span>
            <span id="summarySubtotal" class="font-ui text-cream">₹0</span>
          </div>

          <div class="d-flex justify-content-between mb-3 text-gold" id="discountRow" style="display:none !important">
            <span class="small font-ui ls-wide">Discount <span id="couponLabel"></span></span>
            <span id="summaryDiscount" class="font-ui">−₹0</span>
          </div>

          <div class="d-flex justify-content-between mb-3">
            <span class="small font-ui ls-wide text-muted-cream">Shipping</span>
            <span id="summaryShipping" class="font-ui text-cream">₹79</span>
          </div>

          <hr style="border-color:var(--border)">

          <div class="d-flex justify-content-between mb-4 mt-4">
            <span class="font-display fs-4">Total</span>
            <span class="font-display fs-3 text-gold" id="summaryTotal">₹0</span>
          </div>

          <!-- Coupon -->
          <div class="mb-4">
            <p class="font-ui small ls-wide mb-2 text-muted-cream">PROMO CODE</p>
            <div class="input-group">
              <input type="text" id="couponInput" class="form-control bg-transparent border-bottom border-top-0 border-start-0 border-end-0 rounded-0 text-cream px-0 shadow-none font-ui ls-wide small" style="border-color: var(--border) !important" placeholder="ENTER CODE">
              <button class="btn btn-link text-gold p-0 ms-2 text-decoration-none font-ui small ls-wide" id="applyCoupon">APPLY</button>
            </div>
            <div id="couponMsg" class="small mt-2 font-ui ls-wide" style="font-size: 10px;"></div>
          </div>

          <a href="checkout.html" class="btn btn-gold w-100 py-3" id="checkoutBtn">Proceed to Checkout</a>

          <div class="d-flex justify-content-center align-items-center gap-2 mt-4">
            <i class="bi bi-lock-fill text-gold small"></i>
            <small class="text-muted-cream font-ui ls-wide" style="font-size: 9px;">100% SECURE CHECKOUT • NO ALCOHOL</small>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>
  <div id="cart-drawer-placeholder"></div>
  <div id="toast-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>
    $(document).ready(function() {
      $("#navbar-placeholder").load("partials/_navbar.html", function() {
        $(window).trigger('scroll');
      });
      $("#footer-placeholder").load("partials/_footer.html");
      $("#cart-drawer-placeholder").load("partials/_cart-drawer.html");
      $("#toast-placeholder").load("partials/_toast-container.html");

      renderCart();

      function renderCart() {
        const cart = getCart();
        if (!cart.length) {
          $('#cartItems').html(`
            <div class="text-center py-5 border" style="border-color: var(--border) !important">
              <p class="font-display fs-2 fst-italic text-muted py-5">Your bag is currently empty.</p>
              <a href="shop.html" class="btn btn-gold px-5 py-3">Browse Collection</a>
            </div>
          `);
          $('#checkoutBtn').addClass('disabled');
          updateSummary(0);
          return;
        }

        let html = '';
        cart.forEach(item => {
          html += `
            <div class="cart-row d-flex align-items-center gap-4 py-4 border-bottom" style="border-color:var(--border)!important" data-id="${item.id}">
              <img src="${item.image}" style="width:100px;height:130px;object-fit:cover;filter:brightness(.85)">
              <div class="flex-grow-1">
                <div class="font-display fs-4">${item.name}</div>
                <small class="text-muted-cream font-ui ls-wide small">${item.size}</small>
                <div class="d-flex align-items-center gap-3 mt-4">
                  <div class="d-flex border" style="border-color: var(--border) !important">
                    <button class="btn btn-link text-cream border-0 px-2 py-0 qty-minus"><i class="bi bi-dash"></i></button>
                    <span class="px-2 d-flex align-items-center font-ui small qty-num">${item.qty}</span>
                    <button class="btn btn-link text-cream border-0 px-2 py-0 qty-plus"><i class="bi bi-plus"></i></button>
                  </div>
                  <button class="btn btn-link text-muted-cream btn-sm remove-item p-0 text-decoration-none font-ui ls-wide small" style="font-size: 10px;">REMOVE</button>
                </div>
              </div>
              <div class="text-end">
                <div class="text-gold font-display fs-4">₹${(item.price * item.qty).toLocaleString()}</div>
              </div>
            </div>
          `;
        });
        $('#cartItems').html(html);
        updateSummary();
      }

      function updateSummary() {
        const cart = getCart();
        const subtotal = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        $('#summarySubtotal').text('₹' + subtotal.toLocaleString());

        let discount = 0;
        const coupon = JSON.parse(sessionStorage.getItem('koen_coupon') || 'null');
        if (coupon && subtotal >= coupon.minOrder) {
          if (coupon.type === 'percent') {
            discount = Math.round(subtotal * (coupon.value / 100));
          } else {
            discount = coupon.value;
          }
          $('#discountRow').attr('style', 'display: flex !important');
          $('#couponLabel').text(`(${coupon.code})`);
          $('#summaryDiscount').text('−₹' + discount.toLocaleString());
        } else {
          $('#discountRow').attr('style', 'display: none !important');
        }

        const shipping = subtotal > 1500 ? 0 : 79;
        $('#summaryShipping').text(shipping === 0 ? 'FREE' : '₹79');

        const total = subtotal - discount + (subtotal === 0 ? 0 : shipping);
        $('#summaryTotal').text('₹' + total.toLocaleString());
      }

      $(document).on('click', '.qty-plus', function() {
        const id = $(this).closest('.cart-row').data('id');
        const cart = getCart();
        const item = cart.find(i => i.id == id);
        item.qty++;
        saveCart(cart);
        renderCart();
      });

      $(document).on('click', '.qty-minus', function() {
        const id = $(this).closest('.cart-row').data('id');
        const cart = getCart();
        const item = cart.find(i => i.id == id);
        if (item.qty > 1) {
          item.qty--;
          saveCart(cart);
          renderCart();
        }
      });

      $(document).on('click', '.remove-item', function() {
        const id = $(this).closest('.cart-row').data('id');
        let cart = getCart();
        cart = cart.filter(i => i.id != id);
        saveCart(cart);
        renderCart();
      });

      $('#applyCoupon').on('click', function() {
        const code = $('#couponInput').val().trim().toUpperCase();
        const coupon = KOEN_COUPONS.find(c => c.code === code);
        if (!coupon) {
          $('#couponMsg').html('<span class="text-danger">Invalid coupon code</span>');
          $('#couponInput').addClass('shake');
          setTimeout(() => $('#couponInput').removeClass('shake'), 600);
        } else {
          const subtotal = getCart().reduce((s, i) => s + (i.price * i.qty), 0);
          if (subtotal < coupon.minOrder) {
            $('#couponMsg').html(`<span class="text-warning">Min order ₹${coupon.minOrder} required</span>`);
            return;
          }
          sessionStorage.setItem('koen_coupon', JSON.stringify(coupon));
          $('#couponMsg').html(`<span class="text-success"><i class="bi bi-check-circle"></i> ${coupon.value}${coupon.type==='percent'?'%':'₹'} OFF APPLIED</span>`);
          updateSummary();
        }
      });

      initReveal();
    });
  </script>
</body>
</html>
